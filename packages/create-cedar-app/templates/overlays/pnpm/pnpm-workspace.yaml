autoInstallPeers: false

# The type definitions Cedar generates in `.cedar/types` import and augment
# `@cedarjs/*` packages. TypeScript resolves those imports from the project
# root's `node_modules`, where pnpm only links hoisted packages
publicHoistPattern:
  - '@cedarjs/*'

packages:
  - api
  - web

allowBuilds:
  '@clerk/shared': false
  '@firebase/util': true
  '@prisma/client': false
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: true
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: true
  prisma: false
  protobufjs: false
  unrs-resolver: false

overrides:
  'react-is': '19.3.1'
  'vite': '7.3.8'
