name: 🚢 Publish

# Every npm publish from this repo lives in this one workflow file, on
# purpose: npm trusted publishing (OIDC) allows a single trusted publisher per
# package, and a trusted publisher is identified by the workflow *file name*.
# Renaming this file, or publishing from another workflow, breaks publishing
# for every package until the trusted publisher config on npmjs.com is updated
# to match.
#
# Jobs:
#   - prerelease:         canary/next versions, on every push to main/next
#   - release-candidate:  RCs, on every push to a release/** branch
#   - release:            stable releases, when a vX.Y.Z tag is pushed
#   - cleanup-staging-tags: nightly sweep of orphaned staging dist-tags
#
# None of the jobs use an npm token. `id-token: write` lets npm mint a
# short-lived credential for the job (and attach provenance). NPM_AUTH_TOKEN is
# still honored by the scripts if it's set, so the migration can be finished by
# simply deleting that secret.

on:
  push:
    branches: [main, next, 'release/**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    # No need to run on docs-only changes. (Path filters are ignored for tag
    # pushes, so this can't accidentally skip a release.)
    paths-ignore: ['docs/**']
  schedule:
    - cron: '30 3 * * *' # daily at 03:30 UTC
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        required: true
        options:
          - release
          - cleanup-staging-tags
      tag:
        description: 'For `release`: the vX.Y.Z tag to publish'
        type: string
        required: false
      dry-run:
        description: 'For `release`: run every check and `npm publish --dry-run`, change no dist-tags'
        type: boolean
        required: false
        default: true

# Branch pushes cancel in-progress runs for the same branch, as before. Tag
# pushes, the nightly cleanup and manual runs are queued instead: cancelling a
# release halfway through is the one thing we never want to do, and a sweep and
# a manual sweep would otherwise race on the same tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'cleanup' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions: {}

jobs:
  # ── Canary / next ──────────────────────────────────────────────────────────

  prerelease:
    name: 🦜 Publish Prerelease
    if: >-
      github.repository == 'cedarjs/cedar' &&
      github.event_name == 'push' &&
      github.ref_type == 'branch' &&
      (github.ref_name == 'main' || github.ref_name == 'next')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      version: ${{ steps.get-version.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # `fetch-depth`—number of commits to fetch. `0` fetches all history for all branches and tags.
        #  This is required because we use git tags to determine the version.
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: npm install --global corepack

      - name: Set up job
        uses: ./.github/actions/set-up-job

      - name: ⬢ Make sure npm supports trusted publishing
        run: npm install --global npm@11 && npm --version

      - name: 🔎 Lint
        run: yarn lint

      - name: 🧪 Test
        run: yarn test

      - name: 🚢 Publish
        run: node .github/scripts/publish-prerelease.mts

      - name: 🏷 Get version
        id: get-version
        uses: sergeysova/jq-action@a3f0d4ff59cc1dddf023fc0b325dd75b10deec58 # v2.3.0
        with:
          cmd: 'jq .version packages/core/package.json -r'

      - name: 💬 Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --state merged --json number --jq '.[0].number')
          if [ "$PR_NUMBER" != "null" ] && [ -n "$PR_NUMBER" ]; then
            VERSION="${{ steps.get-version.outputs.value }}"
            # Strip build metadata/commit hash suffix that starts with '+'
            VERSION="${VERSION%%+*}"
            COMMENT_BODY=$(printf "%s\n\n%s\n\n%s" \
              "The changes in this PR are now available on npm." \
              "Try them out by running \`yarn cedar upgrade -t $VERSION\`" \
              "Or try it in a new app with \`yarn dlx create-cedar-app@$VERSION\`")
            gh pr comment $PR_NUMBER --body "$COMMENT_BODY"
          else
            echo "No PR found for commit ${{ github.sha }}"
          fi

  # ── Release candidates ─────────────────────────────────────────────────────

  check-git-tags:
    name: 🏷 Check git tags
    if: >-
      github.repository == 'cedarjs/cedar' &&
      github.event_name == 'push' &&
      github.ref_type == 'branch' &&
      startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # Required because we use git tags to determine the version.
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: npm install --global corepack

      - name: ⬢ Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: 🏷 Check git tags
        run: |
          CURRENT_TAG=$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1)

          # `github.ref_name` is something like `release/minor/v1.1.0`.
          # `basename` gets us `v1.1.0`
          BRANCH_TAG=$(basename ${{ github.ref_name }})

          echo
          echo "Current tag is $CURRENT_TAG"
          echo "Branch tag is $BRANCH_TAG"
          echo "Comparing tags with \"yarn dlx semver-compare-cli $CURRENT_TAG lt $BRANCH_TAG\""
          echo

          # See if the current tag is less than the branch's tag.
          # If it is, we're good to keep going. (If it isn't, the release has
          # already been tagged and this push is the release branch being
          # pushed alongside the tag, so there's no RC to publish.)
          yarn dlx semver-compare-cli $CURRENT_TAG lt $BRANCH_TAG

  release-candidate:
    name: 🏎 Publish Release Candidate
    needs: check-git-tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # `fetch-depth`—number of commits to fetch. `0` fetches all history for all branches and tags.
          #  This is required because we use git tags to determine the version.
          fetch-depth: 0

      - name: Set up job
        uses: ./.github/actions/set-up-job

      - name: ⬢ Make sure npm supports trusted publishing
        run: npm install --global npm@11 && npm --version

      - name: 🔎 Lint
        run: yarn lint

      - name: 🧪 Test
        run: yarn test

      - name: 🚢 Publish Release Candidate
        run: node .github/scripts/publish-release-candidate.mts
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

  # ── Stable releases ────────────────────────────────────────────────────────

  release:
    name: 🚀 Publish Release
    if: >-
      github.repository == 'cedarjs/cedar' &&
      (
        (github.event_name == 'push' && github.ref_type == 'tag') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'release')
      )
    runs-on: ubuntu-latest
    # Protection rules for this environment (required reviewers, etc.) are
    # configured in the repo settings. Leave the environment field blank in the
    # trusted publisher config on npmjs.com, since the other jobs in this file
    # don't use one.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          # Tags are needed to verify that HEAD is the tagged commit
          fetch-depth: 0
          persist-credentials: false

      - name: Set up job
        uses: ./.github/actions/set-up-job

      - name: ⬢ Make sure npm supports trusted publishing
        run: npm install --global npm@11 && npm --version

      - name: 🚀 Publish Release
        run: node .github/scripts/publish-release.mts ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  # ── Nightly cleanup ────────────────────────────────────────────────────────

  cleanup-staging-tags:
    name: 🧹 Cleanup staging dist-tags
    if: >-
      github.repository == 'cedarjs/cedar' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'cleanup-staging-tags')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: ⬢ Enable Corepack
        run: corepack enable

      - name: ⬢ Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: ⬢ Make sure npm supports trusted publishing
        run: npm install --global npm@11 && npm --version

      # No install or build. The script only needs `yarn workspaces list` to
      # find the published packages, then talks to the registry directly.
      - name: 🧹 Remove orphaned staging dist-tags
        run: node .github/scripts/cleanup-staging-tags.mts
