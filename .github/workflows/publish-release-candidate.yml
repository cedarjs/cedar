name: 🏎 Publish Release Candidate

on:
  push:
    branches: ['release/**']
    # We don't want this to run on release
    tags-ignore: ['v**']
    # No need to run on docs-only changes
    paths-ignore: ['docs/**']

# Cancel in-progress runs of this workflow.
# See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-only-cancel-in-progress-jobs-or-runs-for-the-current-workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-git-tags:
    name: 🏷 Check git tags
    if: github.repository == 'cedarjs/cedar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # Required because we use git tags to determine the version.
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: npm install --global corepack

      - name: ⬢ Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: 🏷 Check git tags
        run: |
          # Deliberately not `git describe`. `git describe` resolves the newest
          # tag *reachable from HEAD*, and matches any tag, not just release
          # tags. This repo carries tags inherited from the Redwood history
          # (`rw-v8.0.0`) and per-package tags (`create-redmix-rsc-app/v0.0.3`),
          # and on a branch cut from `main` those are what `git describe`
          # returns. That would fail the comparison below and skip the publish.
          CURRENT_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

          # `github.ref_name` is something like `release/minor/v1.1.0`.
          # `basename` gets us `v1.1.0`
          BRANCH_TAG=$(basename ${{ github.ref_name }})

          echo
          echo "Current tag is $CURRENT_TAG"
          echo "Branch tag is $BRANCH_TAG"
          echo "Comparing tags with \"yarn dlx semver-compare-cli $CURRENT_TAG lt $BRANCH_TAG\""
          echo

          # See if the current tag is less than the branch's tag.
          # If it is, we're good to keep going.
          yarn dlx semver-compare-cli $CURRENT_TAG lt $BRANCH_TAG

  publish-release-candidate:
    name: 🚢 Publish Release Candidate
    needs: check-git-tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # `fetch-depth`—number of commits to fetch. `0` fetches all history for all branches and tags.
          #  This is required because we use git tags to determine the version.
          fetch-depth: 0

      - name: Set up job
        uses: ./.github/actions/set-up-job

      - name: 🔎 Lint
        run: yarn lint

      - name: 🧪 Test
        run: yarn test

      - name: 🚢 Publish Release Candidate
        run: node .github/scripts/publish-release-candidate.mts
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
