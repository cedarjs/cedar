name: Set up job
description: >
  Everything you need to run a job in CI.
  Enable corepack, set up Node.js, yarn install, and build.

inputs:
  set-up-yarn-cache:
    description: >
      For some actions, setting up the yarn cache takes longer than it would to just yarn install.
    required: false
    default: 'true'

  yarn-install-directory:
    description: >
      The directory to run `yarn install` in.
    required: false

  build:
    description: >
      Whether or not to run `yarn build` to build all the framework packages.
    required: false
    default: 'true'

runs:
  using: composite

  steps:
    - name: ⬢ Enable Corepack
      shell: bash
      # Using --force to make this work on Windows
      run: npm install --global --force corepack

    - name: ⬢ Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        # Pin Windows to 24.15.0 to avoid libuv 1.52.x assertion bug on file watching.
        # See https://github.com/libuv/libuv/issues/5010
        node-version: ${{ runner.os == 'Windows' && '24.15.0' || '24' }}

    # We have to enable Corepack again for Windows. 🤷
    # In general, we're waiting on [this issue](https://github.com/actions/setup-node/issues/531)
    # to be resolved so that `actions/setup-node@v4` has first-class Corepack support.
    - name: ⬢ Enable Corepack
      if: runner.os == 'Windows'
      shell: bash
      # Using --force to make this work on Windows
      run: npm install --global --force corepack

    - name: 🐈 Set up yarn cache
      if: inputs.set-up-yarn-cache == 'true'
      id: set-up-yarn-cache
      uses: ./.github/actions/set-up-yarn-cache

    - name: 🔧 Get prebuild-install cache path
      id: prebuild-cache-path
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "cache-path=$APPDATA/npm-cache/_prebuilds" >> "$GITHUB_OUTPUT"
        else
          echo "cache-path=$HOME/.npm/_prebuilds" >> "$GITHUB_OUTPUT"
        fi

    - name: 🔧 Get better-sqlite3 version
      id: bs3-version
      shell: bash
      run: |
        VERSION=$(grep -A 1 "^\"better-sqlite3@" yarn.lock | awk '/^  version:/ {print $2}')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: ♻️ Restore prebuild-install cache
      id: cache-prebuild-install
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      continue-on-error: true
      with:
        path: ${{ steps.prebuild-cache-path.outputs.cache-path }}
        key: prebuild-cache-${{ runner.os }}-${{ steps.bs3-version.outputs.version }}

    # One of our dependencies is on GitHub instead of NPM and without authentication
    # we'll get rate limited and this step becomes flaky.
    - name: 🐈 Yarn install
      shell: bash
      working-directory: ${{ inputs.yarn-install-directory }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: yarn install --inline-builds

    # Run create-cedar-rsc-app install separately so we can skip it on cache hit
    # and retry on failure. The install has been flaky on Windows (exit code 127).
    - name: 🐈 Yarn install (create-cedar-rsc-app)
      if: inputs.set-up-yarn-cache != 'true' || steps.set-up-yarn-cache.outputs.create-cedar-rsc-app-cache-hit != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        cd "$GITHUB_WORKSPACE/packages/create-cedar-rsc-app"
        for i in 1 2 3; do
          yarn install --inline-builds
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            break
          fi
          if [ $i -eq 3 ]; then
            exit $EXIT_CODE
          fi
          echo "Attempt $i failed (exit $EXIT_CODE), retrying in 10s..."
          sleep 10
        done

    - name: 💾 Save node_modules cache
      if: inputs.set-up-yarn-cache == 'true' && steps.set-up-yarn-cache.outputs.node-modules-cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      continue-on-error: true
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package.json', 'yarn.lock', '.yarnrc.yml') }}

    - name: 💾 Save create-cedar-rsc-app node_modules cache
      if: inputs.set-up-yarn-cache == 'true' && steps.set-up-yarn-cache.outputs.create-cedar-rsc-app-cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      continue-on-error: true
      with:
        path: packages/create-cedar-rsc-app/node_modules
        key: node-modules-create-cedar-rsc-app-${{ runner.os }}-${{ hashFiles('packages/create-cedar-rsc-app/yarn.lock', 'packages/create-cedar-rsc-app/package.json') }}

    - name: 💾 Ensure prebuild-install cache path exists
      if: steps.cache-prebuild-install.outputs.cache-hit != 'true'
      shell: bash
      run: mkdir -p "${{ steps.prebuild-cache-path.outputs.cache-path }}"

    - name: 💾 Save prebuild-install cache
      if: steps.cache-prebuild-install.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      continue-on-error: true
      with:
        path: ${{ steps.prebuild-cache-path.outputs.cache-path }}
        key: prebuild-cache-${{ runner.os }}-${{ steps.bs3-version.outputs.version }}

    - name: 🏗️ Build
      if: inputs.build == 'true'
      shell: bash
      # `--output-style=stream` is important. Nx's default CI output style
      # buffers each task's output and only flushes it when that task finishes.
      # When the Nx process itself dies mid-run (which has happened on Windows)
      # everything the in-flight tasks printed is lost, and the step fails with
      # no error output at all. Streaming keeps the output even if we never get
      # a task summary.
      run: bash "$GITHUB_WORKSPACE/.github/scripts/run-nx.sh" yarn build --output-style=stream
